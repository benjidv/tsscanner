<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>TeenStreet Check-in</title>
<link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>

<div class="landing">
  <h1>TeenStreet Check-in</h1>
  <p>Select your role to continue.</p>

  <div class="role-buttons">
    <button class="role-btn" id="btnScanner">
      <span class="icon">&#x1F4F7;</span>
      Scanner
    </button>
    <button class="role-btn" id="btnDashboard">
      <span class="icon">&#x1F4CA;</span>
      Dashboard
    </button>
  </div>
</div>

<!-- PIN dialog for scanner -->
<div class="auth-dialog" id="pinDialog">
  <div class="auth-box">
    <h2>Scanner PIN</h2>
    <input type="password" id="pinInput" maxlength="10" placeholder="Enter PIN" inputmode="numeric" autocomplete="off" />
    <div class="auth-error" id="pinError"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="pinCancel">Cancel</button>
      <button class="btn btn-primary" id="pinSubmit">Enter</button>
    </div>
  </div>
</div>

<!-- Password dialog for dashboard -->
<div class="auth-dialog" id="pwDialog">
  <div class="auth-box">
    <h2>Dashboard Password</h2>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off" />
    <div class="auth-error" id="pwError"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="pwCancel">Cancel</button>
      <button class="btn btn-primary" id="pwSubmit">Enter</button>
    </div>
  </div>
</div>

<script type="module">
import { verifyPin, verifyPassword } from './js/db.js?v=3';

// If already authed, redirect directly
if (sessionStorage.getItem('scannerAuth')) { location.href = 'scanner.html'; }
if (sessionStorage.getItem('dashboardAuth')) { location.href = 'dashboard.html'; }

const pinDialog = document.getElementById('pinDialog');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
const pwDialog = document.getElementById('pwDialog');
const pwInput = document.getElementById('pwInput');
const pwError = document.getElementById('pwError');

// Scanner flow
document.getElementById('btnScanner').addEventListener('click', () => {
  pinDialog.classList.add('visible');
  pinInput.value = '';
  pinError.textContent = '';
  pinInput.focus();
});

document.getElementById('pinCancel').addEventListener('click', () => {
  pinDialog.classList.remove('visible');
});

async function submitPin() {
  const pin = pinInput.value.trim();
  if (!pin) { pinError.textContent = 'Enter a PIN'; return; }
  pinError.textContent = 'Verifying...';
  try {
    const ok = await verifyPin(pin);
    if (ok) {
      sessionStorage.setItem('scannerAuth', '1');
      location.href = 'scanner.html';
    } else {
      pinError.textContent = 'Incorrect PIN';
      pinInput.value = '';
      pinInput.focus();
    }
  } catch (e) {
    pinError.textContent = 'Error connecting to database';
    console.error(e);
  }
}

document.getElementById('pinSubmit').addEventListener('click', submitPin);
pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });

// Dashboard flow
document.getElementById('btnDashboard').addEventListener('click', () => {
  pwDialog.classList.add('visible');
  pwInput.value = '';
  pwError.textContent = '';
  pwInput.focus();
});

document.getElementById('pwCancel').addEventListener('click', () => {
  pwDialog.classList.remove('visible');
});

async function submitPw() {
  const pw = pwInput.value.trim();
  if (!pw) { pwError.textContent = 'Enter a password'; return; }
  pwError.textContent = 'Verifying...';
  try {
    const ok = await verifyPassword(pw);
    if (ok) {
      sessionStorage.setItem('dashboardAuth', '1');
      location.href = 'dashboard.html';
    } else {
      pwError.textContent = 'Incorrect password';
      pwInput.value = '';
      pwInput.focus();
    }
  } catch (e) {
    pwError.textContent = 'Error connecting to database';
    console.error(e);
  }
}

document.getElementById('pwSubmit').addEventListener('click', submitPw);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPw(); });
</script>
</body>
</html>
